services:
  # ===================================================
  # MongoDB Database Service
  # ===================================================
  mongodb:
    image: mongo:7.0
    container_name: chocodor-mongodb
    restart: always
    ports:
      - "27024:27017"
    environment:
      - MONGO_INITDB_DATABASE=chocodor
    volumes:
      - mongodb_data:/data/db
    networks:
      - chocodor-network

  # ===================================================
  # Backend API & SQLite/MongoDB Service
  # ===================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chocodor-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/chocodor
      - DATABASE_PATH=./data/chocodor.db
      - JWT_SECRET=chocodor_super_secret_jwt_key_2026_luxury_indulgence
      - ADMIN_JWT_SECRET=chocodor_admin_jwt_secret_key_secure_2026
    ports:
      - "5008:5000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - mongodb
    networks:
      - chocodor-network

  # ===================================================
  # Frontend Nginx Web Server & Reverse Proxy
  # ===================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chocodor-frontend
    restart: always
    ports:
      - "8084:80"
    depends_on:
      - backend
    networks:
      - chocodor-network

networks:
  chocodor-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
