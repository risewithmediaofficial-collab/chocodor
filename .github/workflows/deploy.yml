name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands & Deploy Docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            # If directory doesn't exist or is not a git repo, clone fresh
            if [ ! -d /docker/chocodor/.git ]; then
              echo "⚡ No git repo found — cloning fresh..."
              rm -rf /docker/chocodor
              mkdir -p /docker
              git clone https://github.com/risewithmediaofficial-collab/chocodor.git /docker/chocodor
            fi

            cd /docker/chocodor
            echo "📥 Fetching latest commits from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building fresh frontend (no-cache) & backend containers..."
            docker compose build --no-cache frontend
            docker compose build backend

            echo "🚀 Launching updated containers..."
            docker compose up -d --force-recreate
            docker image prune -f
            echo "✅ Deployment complete! Containers status:"
            docker compose ps
